name: Android CI

# 推送到 main / PR / 手动触发时构建 R8 压缩版 APK;打 v* 标签时额外发布 Release
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK (R8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 ~/.gradle,依赖与构建缓存跨次复用
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # compileSdk 37.2(小版本 SDK):先接受许可,再装平台;失败则交给 AGP 自动安装
      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" \
            || echo "::warning::sdkmanager 安装 android-37.2 失败,转由 AGP 自动安装"

      - name: Build release APK (R8)
        run: ./gradlew assembleRelease --stacktrace

      # release 用 debug 签名,产物可直接覆盖安装
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NcepuJw-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Publish release (on v* tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: NcepuJw-APK
          path: apk

      - name: Rename APK with tag
        run: mv apk/app-release.apk "apk/NcepuJw-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/NcepuJw-*.apk
          generate_release_notes: true
