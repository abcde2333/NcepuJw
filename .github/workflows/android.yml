name: Android CI

# 推送到 main / PR / 手动触发时构建 R8 压缩版 APK;打 v* 标签时额外发布 Release
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build release APK (R8)
    runs-on: ubuntu-latest
    outputs:
      vcode: ${{ steps.ver.outputs.vcode }}
      vname: ${{ steps.ver.outputs.vname }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 缓存 ~/.gradle,依赖与构建缓存跨次复用
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 还原固定签名 keystore(Secrets),保证发布 APK 签名稳定、应用内更新可覆盖安装
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "${{ github.workspace }}/release.keystore"
            echo "KEYSTORE_FILE=${{ github.workspace }}/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 KEYSTORE_BASE64,将使用 runner 生成的 debug 签名(不可用于应用内更新)"
          fi

      # compileSdk 37.2(小版本 SDK):先接受许可,再装平台;失败则交给 AGP 自动安装
      - name: Ensure Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" \
            || echo "::warning::sdkmanager 安装 android-37.2 失败,转由 AGP 自动安装"

      - name: Read version
        id: ver
        run: |
          echo "vcode=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
          echo "vname=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Build release APK (R8)
        run: ./gradlew assembleRelease --stacktrace

      # release 用 debug 签名,产物可直接覆盖安装
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NcepuJw-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    name: Publish release (on v* tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: NcepuJw-APK
          path: apk

      - name: Rename APK with tag
        run: mv apk/app-release.apk "apk/NcepuJw-${GITHUB_REF_NAME}.apk"

      # 自动更新元数据:sha256 随 APK 发布同步写入 latest.json(供应用内更新校验)
      - name: Update latest.json with apkHash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HASH=$(sha256sum "apk/NcepuJw-${GITHUB_REF_NAME}.apk" | cut -d' ' -f1)
          VCODE="${{ needs.build.outputs.vcode }}"
          VNAME="${{ needs.build.outputs.vname }}"
          APKURL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/NcepuJw-${GITHUB_REF_NAME}.apk"
          # 更新日志:从 main 根目录 RELEASE_NOTES.txt 读取,写入 latest.json.notes 供 App 更新弹窗展示
          NOTES=$(curl -s --max-time 25 "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/RELEASE_NOTES.txt" || true)
          JSON=$(jq -n --arg c "$VCODE" --arg n "$VNAME" --arg u "$APKURL" --arg h "$HASH" --arg notes "$NOTES"             '{versionCode:($c|tonumber), versionName:$n, apkUrl:$u, apkHash:$h, notes:$notes}')
          SHA=""
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/latest.json?ref=main" --jq '.sha' 2>/dev/null) || SHA=""
          # contents API 必须 PUT(POST 会 404);更新需带现有文件 sha
          APIARGS=(-f message="latest.json: ${GITHUB_REF_NAME}" -f content="$(echo "$JSON" | base64 -w0)")
          if [ -n "$SHA" ]; then
            APIARGS+=(-f sha="$SHA")
          fi
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/latest.json" "${APIARGS[@]}"

      # 清 jsDelivr CDN 缓存:老版本 App 按"第一个有效源"取 latest.json,jsDelivr 会缓存
      # @main 文件较久,不清就可能长时间仍返回旧版本。清完 + 等待刷新,老客户端才能发现新版。
      - name: Purge jsDelivr cache
        run: |
          curl -s --max-time 25 "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/latest.json" || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apk/NcepuJw-*.apk
          generate_release_notes: true
